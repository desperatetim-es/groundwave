name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"   # latest patch: the standard library is compiled into our binaries
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/groundwave

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"   # latest patch: the standard library is compiled into our binaries
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Third-party notices are current
        run: go run ./tools/licenses -check

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"   # latest patch: the standard library is compiled into our binaries
      - name: Build every release target
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/groundwave
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/groundwave
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/groundwave
          GOOS=linux GOARCH=arm GOARM=7 go build -o /dev/null ./cmd/groundwave
